name: CI Pipeline

on:
  push:
    branches:
      - master
      - task-1

  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

    
      - name: Run linting
        run: |
          flake8 src/

      - name: Run tests
        run: |
          python -m pytest